<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="title.asset">Asset details — Coinfolio</title>
  <meta name="description" content="Price, market stats, your position and transaction history of a coin." data-i18n-attr="content:desc.asset">
  <meta name="theme-color" content="#0B0F1A">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <script>
    // Apply the saved theme before the first paint (no flash of the wrong theme).
    try {
      var theme = localStorage.getItem('coinfolio-theme');
      if (theme === 'system') { theme = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark'; }
      if (theme === 'light' || theme === 'dark') { document.documentElement.dataset.theme = theme; }
    } catch (e) { /* storage blocked: keep the default dark theme */ }
  </script>
  <script type="module" crossorigin src="./assets/main-B7_KIXTQ.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/main-DeTzUuDS.css">
</head>

<body class="page page--asset">

<a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>
<header class="site-header">
  <a class="site-header__logo logo" href="./index.html" aria-label="Coinfolio — go to dashboard" data-i18n-attr="aria-label:brand.home">
    <img class="logo__mark" src="./img/logo-mark.svg" alt="" width="32" height="32">
    <span class="logo__text">Coinfolio</span>
  </a>
  <nav class="site-nav" aria-label="Main navigation" data-i18n-attr="aria-label:nav.label">
    <ul class="site-nav__list">

      <li class="site-nav__item site-nav__item--index">
        <a class="site-nav__link" href="./index.html">
          <svg class="icon icon--dashboard" width="20" height="20" aria-hidden="true" focusable="false"><use href="./img/icons.svg#dashboard"></use></svg>

          <span class="site-nav__label" data-i18n="nav.dashboard">Dashboard</span>
        </a>
      </li>

      <li class="site-nav__item site-nav__item--assets">
        <a class="site-nav__link site-nav__link--active" href="./assets.html" aria-current="page">
          <svg class="icon icon--assets" width="20" height="20" aria-hidden="true" focusable="false"><use href="./img/icons.svg#assets"></use></svg>

          <span class="site-nav__label" data-i18n="nav.assets">Assets</span>
        </a>
      </li>

      <li class="site-nav__item site-nav__item--watchlist">
        <a class="site-nav__link" href="./assets.html?filter=watchlist">
          <svg class="icon icon--star" width="20" height="20" aria-hidden="true" focusable="false"><use href="./img/icons.svg#star"></use></svg>

          <span class="site-nav__label" data-i18n="nav.watchlist">Watchlist</span>
        </a>
      </li>

      <li class="site-nav__item site-nav__item--profile">
        <a class="site-nav__link" href="./profile.html">
          <svg class="icon icon--user" width="20" height="20" aria-hidden="true" focusable="false"><use href="./img/icons.svg#user"></use></svg>

          <span class="site-nav__label" data-i18n="nav.profile">Profile</span>
        </a>
      </li>

      <li class="site-nav__item site-nav__item--add">
        <a class="site-nav__link site-nav__link--add" href="./asset.html#/item/btc/trade">
          <svg class="icon icon--plus" width="20" height="20" aria-hidden="true" focusable="false"><use href="./img/icons.svg#plus"></use></svg>

          <span class="site-nav__label" data-i18n="nav.add">Add transaction</span>
        </a>
      </li>
    </ul>
  </nav>
  <form class="site-search" role="search" action="./assets.html" method="get">
    <label class="site-search__label" for="site-search" data-i18n="search.label">Search coins</label>
    <input class="site-search__input" id="site-search" name="q" type="search" autocomplete="off"
      placeholder="Search coins…" data-i18n-attr="placeholder:search.placeholder">
    <kbd class="site-search__hint">Ctrl K</kbd>
    <button class="site-search__submit icon-button" type="submit">
      <svg class="icon icon--search" width="20" height="20" aria-hidden="true" focusable="false"><use href="./img/icons.svg#search"></use></svg>

      <span class="visually-hidden" data-i18n="search.submit">Search</span>
    </button>
  </form>
  <div class="site-header__actions">
    <button class="icon-button site-header__notifications" type="button" aria-describedby="notifications-count">
      <svg class="icon icon--bell" width="20" height="20" aria-hidden="true" focusable="false"><use href="./img/icons.svg#bell"></use></svg>

      <span class="visually-hidden" data-i18n="header.notifications">Notifications</span>
    </button>
    <span class="visually-hidden" id="notifications-count" data-i18n="header.unread">2 unread</span>
    <a class="avatar avatar--sm site-header__avatar" href="./profile.html">
      <picture class="avatar__picture">
        <source type="image/webp" srcset="./img/profile/avatar-80.webp 1x, ./img/profile/avatar-160.webp 2x, ./img/profile/avatar-240.webp 3x">
        <img class="avatar__img" src="./img/profile/avatar-80.jpg" srcset="./img/profile/avatar-80.jpg 1x, ./img/profile/avatar-160.jpg 2x"
          width="40" height="40" alt="Your profile" data-i18n-attr="alt:header.profile">
      </picture>
    </a>
  </div>
</header>


<main class="page__main asset-page" id="main">
  <nav class="breadcrumbs" aria-label="Breadcrumb" data-i18n-attr="aria-label:crumbs.label">
    <ol class="breadcrumbs__list">
      <li class="breadcrumbs__item"><a class="breadcrumbs__link" href="./assets.html" data-i18n="nav.assets">Assets</a></li>
      <li class="breadcrumbs__item"><span class="breadcrumbs__current" aria-current="page" data-crumb>…</span></li>
    </ol>
  </nav>

  
  <article class="asset" itemscope itemtype="https://schema.org/ExchangeRateSpecification" aria-busy="true">
    <h1 class="visually-hidden" data-i18n="asset.heading">Asset details</h1>
  </article>
  <div class="asset-page__state" hidden></div>
</main>

<footer class="site-footer">
  <p class="site-footer__copy"><small data-i18n="footer.copy">© 2026 Coinfolio · Educational project, KPI</small></p>
  <p class="site-footer__note" data-i18n="footer.data">Prices are demo data from a local json-server</p>
  <nav class="site-footer__nav" aria-label="Language" data-i18n-attr="aria-label:footer.lang">
    <ul class="site-footer__langs">
      <li class="site-footer__lang"><a class="site-footer__link" href="?lang=en" hreflang="en" lang="en">English</a></li>
      <li class="site-footer__lang"><a class="site-footer__link" href="?lang=uk" hreflang="uk" lang="uk">Українська</a></li>
    </ul>
  </nav>
</footer>

</body>
</html>
